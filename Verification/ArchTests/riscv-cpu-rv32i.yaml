# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: riscv-cpu-rv32i
description: >
  RISC-V-CPU (this repo's 5-stage pipelined `top` module): base RV32I only.
  No CSR file, no privilege modes (M-mode is implicit/only), no traps other
  than the core's own illegal-instruction halt, and no interrupts. See
  Verification/ArchTests/rvmodel_macros.h for the reasoning behind the
  matching test_config.yaml's `include_priv_tests: False`.
implemented_extensions:
  - { name: I, version: "= 2.1" }

params:
  # Base XLEN for the hart. This is the one param the ACT4 framework's
  # "minimal header" example (docs/DeveloperGuide.md) requires even for a
  # single-extension, unprivileged-only I config:
  #   REQUIRED_EXTENSIONS: ['I']
  #   params:
  #     MXLEN: 32
  MXLEN: 32
