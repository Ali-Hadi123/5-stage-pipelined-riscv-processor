name: RTL Regression Tests

# Runs the full testbench suite (Icarus Verilog) on every push and every PR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}  

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog

      - name: Run RTL regression suite
        run: |
          chmod +x ./run_tests.sh
          ./run_tests.sh

      - name: Install RISC-V toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf

      - name: Clone riscv-arch-test (RV32I subset only, used below)
        run: |
          git clone --depth 1 https://github.com/riscv-non-isa/riscv-arch-test.git /tmp/riscv-arch-test

      - name: Run RV32I architecture tests
        env:
          PREFIX: riscv64-unknown-elf-
        run: |
          chmod +x "Verification/Arch Tests/run_arch_tests.sh"
          "Verification/Arch Tests/run_arch_tests.sh" /tmp/riscv-arch-test
